<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://p.trellocdn.com/@atlaskit-themes.min.css"
    />
    <link rel="stylesheet" href="https://p.trellocdn.com/power-up.css" />
    <link rel="stylesheet" href="../css/load-assignments.css" />
    <script
      src="https://p.trellocdn.com/power-up.min.js"
      crossorigin="anonymous"
    ></script>
    <script>
      window.canvasPowerUp = window.TrelloPowerUp.iframe({
        appKey: "b5c06882ca740f9920dae402dfbb8341",
        appName: "Canvas PowerUp",
      });
    </script>
    <script
      src="https://cdn.socket.io/4.6.0/socket.io.min.js"
      integrity="sha384-c79GN5VsunZvi+Q/WObgk2in0CbZsHnjEqvFxC5DxHn9lTfNce2WW6h2pH6u/kF+"
      crossorigin="anonymous"
    ></script>
    <title>Load Canvas Assignments</title>
  </head>
  <body>
    <div id="loading" class="loading">
      <p>Loading courses from Canvas...</p>
    </div>

    <div id="content" style="display: none">
      <div class="course-section">
        <label for="list">Import to List:</label>
        <select name="list" id="list" class="mod-input">
          <option value="">Choose a list...</option>
        </select>
      </div>

      <div class="course-section">
        <label for="course">Select Course:</label>
        <select name="course" id="course" class="mod-input">
          <option value="">Choose a course...</option>
        </select>
      </div>

      <div class="filters-section">
        <h3>Filters</h3>
        <div class="filters-list">
          <label class="filter-option" for="hide-completed">
            <input type="checkbox" id="hide-completed" />
            Hide completed assignments
          </label>
        </div>
      </div>

      <div id="assignments-section">
        <h3>Course Items</h3>
        <div id="assignments-list" class="assignments-list">
          <div class="empty-state">Select a course to view assignments.</div>
        </div>

        <div class="actions">
          <button id="select-all" class="mod-primary" disabled>
            Select All
          </button>
          <button id="select-none" class="mod-secondary" disabled>
            Select None
          </button>
          <span
            id="import-tooltip-container"
            class="import-tooltip-container"
          >
            <button
              id="import-selected"
              class="mod-primary"
              aria-disabled="true"
              aria-describedby="import-tooltip"
            >
              Import Selected to Trello
            </button>
            <span id="import-tooltip" class="import-tooltip" role="tooltip" hidden>
              Select one or more assignments and choose a Trello list to enable
              importing.
            </span>
          </span>
        </div>
      </div>

      <div id="status"></div>
    </div>

    <script type="module" src="../js/load.js"></script>
  </body>
</html>
